name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Database axis: every driver on both PHP versions, with coverage on 8.3.
          - { php-version: '8.3', db-type: sqlite, composer-type: stable, coverage: true }
          - { php-version: '8.3', db-type: mysql, composer-type: stable, coverage: true }
          - { php-version: '8.3', db-type: pgsql, composer-type: stable, coverage: true }
          - { php-version: '8.5', db-type: sqlite, composer-type: stable }
          - { php-version: '8.5', db-type: mysql, composer-type: stable }
          - { php-version: '8.5', db-type: pgsql, composer-type: stable }
          # Dependency axis: version bugs do not depend on the driver, pgsql
          # stays for its sequence and NOT NULL strictness.
          - { php-version: '8.3', db-type: sqlite, composer-type: lowest }
          - { php-version: '8.3', db-type: pgsql, composer-type: lowest }
          - { php-version: '8.5', db-type: sqlite, composer-type: dev }

    name: Tests - PHP ${{ matrix.php-version }} & ${{ matrix.db-type }} & ${{ matrix.composer-type }}

    services:
      postgres:
        # An empty image skips the service on non-pgsql jobs.
        image: ${{ matrix.db-type == 'pgsql' && 'postgres' || '' }}
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: test_fixture_factories
          POSTGRES_PASSWORD: root
          POSTGRES_USER: root

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, apcu, pdo_${{ matrix.db-type }}
          ini-values: apc.enable_cli = 1
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}

      - name: Update composer
        run: composer self-update --snapshot

      - name: Validate composer.json
        run: composer validate

      - name: Install dependencies
        run: |
          if [[ ${{ matrix.composer-type }} == 'lowest' ]]; then
            composer update --prefer-dist --no-progress --no-suggest --prefer-stable --prefer-lowest
          elif [[ ${{ matrix.composer-type }} == 'stable' ]]; then
            composer update --prefer-dist --no-progress --no-suggest --prefer-stable
          else
            composer update --prefer-dist --no-progress --no-suggest
          fi

      - name: Run tests
        run: |
          if [ ${{ matrix.db-type }} == 'mysql' ]; then
            sudo service mysql start && mysql -h 127.0.0.1 -u root -proot -e 'CREATE DATABASE IF NOT EXISTS test_fixture_factories;';
          fi
          if [[ '${{ matrix.coverage }}' == 'true' ]]; then
            composer ${{ matrix.db-type }} -- --with-coverage
          else
            composer ${{ matrix.db-type }}
          fi

      - name: Upload coverage reports to Codecov
        if: success() && matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: ${{ matrix.db-type }}

  checks:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3']

    name: PHPStan / Code Standards - PHP ${{ matrix.php-version }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, apcu
          ini-values: apc.enable_cli = 1

      - name: Update composer
        run: composer self-update

      - name: Validate composer.json
        run: composer validate

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-suggest --prefer-stable

      - name: Bake factories to perform analysis in the following steps
        run: vendor/bin/phpunit tests/TestCase/Command/BakeFixtureFactoryCommandTest.php

      - name: Clean SQLite DB to avoid stale triggers from bake tests
        run: rm -f test_fixture_factories tests/.env

      - name: Run phpstan
        run: composer stan

      - name: Run phpcs
        run: composer cs-check

  docs:
    name: Documentation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run docs:build:versioned
        working-directory: docs

  php-minimum:
    name: PHP 8.2 with Faker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
      - name: Install dependencies without the optional PHP 8.3 generator
        run: |
          composer remove --dev johnykvsky/dummygenerator --no-update
          composer update --prefer-dist --no-progress --prefer-stable
      - name: Run factory, command and transaction coverage
        run: vendor/bin/phpunit --filter 'TestCase.(Factory|Command|TestSuite)'
